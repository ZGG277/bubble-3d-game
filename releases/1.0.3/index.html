<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152c3b"><title>泡泡 · 真3D风场实验</title><link rel="stylesheet" href="style.css"></head><body><main id="stage"><canvas id="game" aria-label="泡泡上云端：按住吹大，松手放飞；按住底部左右拖动扇子，穿过彩虹圈收集小彩虹，避开两侧和小鸟" tabindex="0"></canvas><canvas id="bubble3d" aria-hidden="true"></canvas><header><div class="hud-stats"><div class="counter"><img class="rainbow-icon" src="rainbow.svg" alt="收集彩虹"><strong id="score">0</strong></div><div id="height">0 m</div></div><span id="best" hidden></span><button id="settings" aria-label="打开设置">☷</button></header><div id="hint">按住，吹一个泡泡<span>松手放飞 · 穿彩虹圈上云端</span></div><div id="readout" aria-live="polite"></div><div id="result" hidden><strong id="final"><img class="rainbow-icon" src="rainbow.svg" alt="收集彩虹"><span id="final-count">0</span></strong><p id="breakdown">飞行 0 米</p><p id="bird-advice" hidden>提前控制泡泡速度，躲开小鸟</p><div class="result-actions"><button id="share" type="button">分享</button><button id="again" type="button">再吹一个</button></div><p id="share-status" role="status" aria-live="polite"></p></div><div id="paused" hidden><button id="resume">轻点继续</button></div><section id="panel" role="dialog" aria-modal="true" aria-label="设置" hidden><div><button class="close" id="close-settings" type="button" aria-label="关闭设置">×</button><h2>真3D泡泡实验</h2><p>WebGL 三维网格与薄膜光照。风场同时驱动平移与阻尼形变，是近似软体模型，不是完整流体求解。路线和障碍仍为二维玩法。</p><label><span>轻音效</span><input id="sound" type="checkbox" checked></label><button id="test-bird" type="button">试听鸟鸣</button><p id="audio-status" role="status"></p><p>无需授权，按住屏幕即可游玩。</p><p>按住吹大，松手或轻滑放飞。<br>按住底部滑动扇子。右下送风推向左上，左下送风推向右上；正下托起，松手收风，别碰四周。<br>整颗穿过彩虹圈 +1；碰到圈的两侧或小鸟即破。<br>持续送风向上飞；高度是次指标，彩虹数量单独记最佳。<br>也可用空格吹气，方向键移动扇子。</p></div></section><footer>泡泡上云端 <span>UP, UP & AWAY</span></footer></main><script src="./platform.js"></script><script src="./core.js"></script><script src="./scenery.js"></script><script src="./bubble3d.js"></script><script src="./bird-samples.js"></script><script src="./ambience.js"></script><script src="./game.js"></script></body></html>
