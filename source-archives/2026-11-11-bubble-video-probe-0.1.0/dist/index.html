<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>泡泡重演实验</title><link rel="stylesheet" href="./style.css"></head><body><main><p class="tag">独立实验 · 不影响正式版</p><h1>把精彩变成 10 秒</h1><p>固定轨迹重演，用来验证手机能否生成 MP4。无录屏、无麦克风、无音轨。</p><canvas id="scene" width="360" height="640" aria-label="泡泡固定轨迹重演"></canvas><div class="buttons"><button id="replay">只看重演</button><button id="wc">试 WebCodecs MP4</button><button id="mr">试 MediaRecorder MP4</button><button id="stop" disabled>停止实验</button><button id="editor" disabled>带入视频编辑页（不要发布）</button></div><p id="status" role="status">正在检测能力…</p><p class="hint">进入编辑页后检查：约 10 秒、画面方向正确、能拖动播放，然后取消返回。不会自动发布；请不要点发布。</p><details open><summary>诊断记录（可截图回传）</summary><pre id="log"></pre></details><p class="hint">失败时可继续看动画，或用手机系统录屏；不会伪装成已生成视频。实际兼容性待创服模拟器、Android 与 iOS 真机验证。</p></main><script src="./mux.js"></script><script src="./app.js"></script></body></html>
